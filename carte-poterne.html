<h1>La poterne du Vieux Fraimbois</h1>
<p>La poterne des ruines du Vieux <a class="auto" href="carte-fraimbois.html">Fraimbois</a>.</p>

<div id="map" style="aspect-ratio: 1036 / 1000"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const M = {"w": 1036, "h": 1000, "places": []};
const W = M.w, H = M.h;
const map = L.map('map', {crs: L.CRS.Simple, minZoom: -4, maxZoom: 3, zoomSnap: 0, zoomDelta: 0.5});
const bounds = [[0, 0], [H, W]];
L.imageOverlay('carte-poterne.jpg', bounds).addTo(map);
map.fitBounds(bounds);
// Keep the whole map visible when the window size changes (phone rotation, resize).
window.addEventListener('resize', () => { map.invalidateSize(); map.fitBounds(bounds); });
map.setMaxBounds([[-H * 0.2, -W * 0.2], [H * 1.2, W * 1.2]]);
for (const p of M.places) {
  if (p.virtual) continue;  // not a place: a group of characters in the centre of a city plan
  const hasPlan = !!p.map;
  const link = hasPlan ? '<br><a href="carte-' + p.map + '.html">Ouvrir le plan →</a>' : '';
  const marker = L.circleMarker([H - p.y, p.x], {
      radius: 8, color: '#7a1f1f', weight: 2,
      fillColor: '#f2d27a', fillOpacity: 0.9})
    .addTo(map)
    .bindTooltip(p.name);
  // A click opens the description of the place; if there is none, its plan; else a bubble.
  if (p.desc) marker.on('click', () => { window.location.href = p.desc; });
  else if (hasPlan) marker.on('click', () => { window.location.href = 'carte-' + p.map + '.html'; });
  else marker.bindPopup('<strong>' + p.name + '</strong><br>' + p.text);
}
// Layer "Vivants": round portraits of the characters next to the place where they are now.
// Two layers of the living: those the heroes know, and those they have not met yet.
function livingLayer(unmet, anchorY) {
  const layer = L.layerGroup();
  for (const p of M.places) {
    const group = (p.people || []).filter(c => !!c.unmet === unmet);
    if (!group.length) continue;
    const faces = group.slice(0, 3).map(c => c.img
        ? '<img src="' + c.img + '" alt="">' : '<span>' + c.initials + '</span>').join('');
    const more = group.length > 3 ? '<span>+' + (group.length - 3) + '</span>' : '';
    const icon = L.divIcon({className: 'people-icon' + (unmet ? ' unmet-icon' : ''), html: (unmet ? '<b>?</b>' : '') + faces + more,
                            iconSize: null, iconAnchor: [-10, anchorY]});
    const list = group.map(c => '<a href="' + c.href + '">' + c.name + '</a>').join('<br>');
    L.marker([H - p.y, p.x], {icon: icon}).bindPopup('<strong>' + p.name + '</strong><br>' + list).addTo(layer);
  }
  return layer;
}
const people = livingLayer(false, 14);
const strangers = livingLayer(true, 40);
// Layer "Morts": the dead, where they rest (or where they died). On at first, except on the main map.
const dead = L.layerGroup();
for (const p of M.places) {
  if (!p.dead) continue;
  const faces = p.dead.slice(0, 3).map(c => c.img
      ? '<img src="' + c.img + '" alt="">' : '<span>' + c.initials + '</span>').join('');
  const more = p.dead.length > 3 ? '<span>+' + (p.dead.length - 3) + '</span>' : '';
  const icon = L.divIcon({className: 'people-icon dead-icon', html: '<b>†</b>' + faces + more, iconSize: null, iconAnchor: [-10, -6]});
  const list = p.dead.map(c => '<a href="' + c.href + '">' + c.name + '</a> <small>(' + c.how + ')</small>').join('<br>');
  L.marker([H - p.y, p.x], {icon: icon}).bindPopup('<strong>† ' + p.name + '</strong><br>' + list).addTo(dead);
}
// Each map remembers its own layer choice (in this browser only), independently of the other maps.
const layersKey = 'map-layers-v5:' + location.pathname;  // v5: living split into known and unknown
let shown = {'Vivants connus': true, 'Vivants inconnus': false, 'Morts': !/\/carte\.html$/.test(location.pathname)};
try { Object.assign(shown, JSON.parse(localStorage.getItem(layersKey) || '{}')); } catch (e) {}
const overlays = {};
if (Object.keys(people._layers).length) { overlays['Vivants connus'] = people; if (shown['Vivants connus']) people.addTo(map); }
if (Object.keys(strangers._layers).length) { overlays['Vivants inconnus'] = strangers; if (shown['Vivants inconnus']) strangers.addTo(map); }
if (Object.keys(dead._layers).length) { overlays['Morts'] = dead; if (shown['Morts']) dead.addTo(map); }
if (Object.keys(overlays).length) L.control.layers(null, overlays, {collapsed: false}).addTo(map);
function remember(e, on) {
  shown[e.name] = on;
  try { localStorage.setItem(layersKey, JSON.stringify(shown)); } catch (err) {}
}
map.on('overlayadd', e => remember(e, true));
map.on('overlayremove', e => remember(e, false));
</script>
