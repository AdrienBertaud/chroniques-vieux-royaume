<h1>La poterne du Vieux Fraimbois</h1>
<p>La poterne des ruines du Vieux <a class="auto" href="carte-fraimbois.html">Fraimbois</a>.</p>

<div id="map" style="aspect-ratio: 1036 / 1000"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const M = {"w": 1036, "h": 1000, "places": []};
const W = M.w, H = M.h;
const map = L.map('map', {crs: L.CRS.Simple, minZoom: -4, maxZoom: 3, zoomSnap: 0, zoomDelta: 0.5});
const bounds = [[0, 0], [H, W]];
L.imageOverlay('carte-poterne.jpg', bounds).addTo(map);
map.fitBounds(bounds);
// Keep the whole map visible when the window size changes (phone rotation, resize).
window.addEventListener('resize', () => { map.invalidateSize(); map.fitBounds(bounds); });
map.setMaxBounds([[-H * 0.2, -W * 0.2], [H * 1.2, W * 1.2]]);
for (const p of M.places) {
  if (p.virtual) continue;  // not a place: a group of characters in the centre of a city plan
  const hasPlan = !!p.map;
  const link = hasPlan ? '<br><a href="carte-' + p.map + '.html">Ouvrir le plan →</a>' : '';
  const marker = L.circleMarker([H - p.y, p.x], {
      radius: 8, color: '#7a1f1f', weight: 2,
      fillColor: '#f2d27a', fillOpacity: 0.9})
    .addTo(map)
    .bindTooltip(p.name);
  // A click opens the description of the place; if there is none, its plan; else a bubble.
  if (p.desc) marker.on('click', () => { window.location.href = p.desc; });
  else if (hasPlan) marker.on('click', () => { window.location.href = 'carte-' + p.map + '.html'; });
  else marker.bindPopup('<strong>' + p.name + '</strong><br>' + p.text);
}
// Layer "Vivants": round portraits of the characters next to the place where they are now.
// Four switches: "Vivants" and "Morts" (alive or dead), "Vus" and "Autres" (met or not met yet).
// A character is shown when both its switches are ticked.
const layersKey = 'map-layers-v8:' + location.pathname;  // v8: switches renamed « Vus » and « Autres »
let shown = {'Vivants': true, 'Morts': false, 'Vus': true, 'Autres': false};  // by default: the living the heroes know
try { Object.assign(shown, JSON.parse(localStorage.getItem(layersKey) || '{}')); } catch (e) {}
const content = L.layerGroup().addTo(map);
function faces(group) {
  const f = group.slice(0, 3).map(c => c.img ? '<img src="' + c.img + '" alt="">' : '<span>' + c.initials + '</span>').join('');
  return f + (group.length > 3 ? '<span>+' + (group.length - 3) + '</span>' : '');
}
function keep(c) { return c.unmet ? shown['Autres'] : shown['Vus']; }
function render() {
  content.clearLayers();
  for (const p of M.places) {
    const living = shown['Vivants'] ? (p.people || []).filter(keep) : [];
    if (living.length) {
      const icon = L.divIcon({className: 'people-icon', html: faces(living), iconSize: null, iconAnchor: [-10, 14]});
      const list = living.map(c => '<a href="' + c.href + '">' + c.name + '</a>' + (c.unmet ? ' <small>(jamais vu)</small>' : '')).join('<br>');
      L.marker([H - p.y, p.x], {icon: icon}).bindPopup('<strong>' + p.name + '</strong><br>' + list).addTo(content);
    }
    const dead = shown['Morts'] ? (p.dead || []).filter(keep) : [];
    if (dead.length) {
      const icon = L.divIcon({className: 'people-icon dead-icon', html: '<b>†</b>' + faces(dead), iconSize: null, iconAnchor: [-10, -6]});
      const list = dead.map(c => '<a href="' + c.href + '">' + c.name + '</a> <small>(' + c.how + ')</small>').join('<br>');
      L.marker([H - p.y, p.x], {icon: icon}).bindPopup('<strong>† ' + p.name + '</strong><br>' + list).addTo(content);
    }
  }
}
const any = M.places.some(p => (p.people || []).length || (p.dead || []).length);
if (any) {
  const switches = {};
  for (const name of ['Vivants', 'Morts', 'Vus', 'Autres']) {
    switches[name] = L.layerGroup();
    if (shown[name]) switches[name].addTo(map);
  }
  L.control.layers(null, switches, {collapsed: false}).addTo(map);
  map.on('overlayadd overlayremove', e => {
    shown[e.name] = e.type === 'overlayadd';
    try { localStorage.setItem(layersKey, JSON.stringify(shown)); } catch (err) {}
    render();
  });
  render();
}
</script>
