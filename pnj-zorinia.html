<header><span class="session-timer" data-start="2026-11-21T14:00" data-minutes="240" hidden></span><script>(()=>{const t=document.currentScript.previousElementSibling;
const start=new Date(t.dataset.start).getTime(),end=start+t.dataset.minutes*60000;
const f=(ms,up)=>{const t=up?Math.ceil(ms/60000):Math.floor(ms/60000);
return Math.floor(t/60)+" h "+String(t%60).padStart(2,"0")};
const tick=()=>{const now=Date.now();
if(now>end+3600000){t.hidden=true;return}
t.hidden=false;
if(now<start){const d=new Date(start),p=n=>String(n).padStart(2,"0");t.classList.remove("over");
t.innerHTML="📅 Début : "+p(d.getDate())+"/"+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes())+'<span class="long"> · durée prévue '+f(end-start).replace(/ 00$/,"")+"</span>"}
else if(now<=end){t.classList.remove("over");t.textContent="⏳ "+f(end-now,true)}
else{t.classList.add("over");t.textContent="⌛ Fin de la séance (+"+f(now-end)+")"}};
tick();setInterval(tick,1000)})()</script><div class="bar">
