<header><div class="bar"><span class="session-timer" data-start="2026-11-17T14:00" data-minutes="10" hidden></span><script>(()=>{const t=document.currentScript.previousElementSibling;
const start=new Date(t.dataset.start).getTime(),end=start+t.dataset.minutes*60000;
const f=(ms,up)=>{const t=up?Math.ceil(ms/60000):Math.floor(ms/60000);
return Math.floor(t/60)+" h "+String(t%60).padStart(2,"0")};
const tick=()=>{const now=Date.now();
if(now<start||now>end+3600000){t.hidden=true;return}
t.hidden=false;
if(now<=end){t.classList.remove("over");t.textContent="⏳ "+f(end-now,true)}
else{t.classList.add("over");t.textContent="⌛ Fin de la séance (+"+f(now-end)+")"}};
tick();setInterval(tick,1000)})()</script>
